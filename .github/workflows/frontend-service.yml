# Template compartilhado para front-ends (Node/Angular servido por contêiner).
# Consumido pelo .github/workflows/ci.yml de cada aplicação via "uses:" (workflow reutilizável).
#
# Etapas: testes → Trivy no código → build linux/arm64 → push no GHCR → Trivy na imagem
#         → commit da nova tag em <overlay-path>/kustomization.yaml do repositório da plataforma
#         → o Argo CD sincroniza. A esteira nunca acessa o cluster.
name: frontend-service

on:
  workflow_call:
    inputs:
      platform-repository:
        description: "Repositório GitOps da plataforma (<owner>/tcc-platform)"
        type: string
        required: true
      overlay-path:
        description: "Overlay da aplicação no repositório da plataforma (ex.: apps/catalogo-front)"
        type: string
        required: true
      node-version:
        type: string
        default: "22"
      working-directory:
        type: string
        default: "."
      install-command:
        type: string
        default: "npm ci"
      test-command:
        description: "Comando de testes; vazio pula a etapa"
        type: string
        default: "npm test -- --watch=false --browsers=ChromeHeadless"
      build-command:
        description: "Build de verificação antes da imagem; vazio pula (o Dockerfile builda de novo)"
        type: string
        default: "npm run build"
      dockerfile:
        type: string
        default: "Dockerfile"
      build-context:
        type: string
        default: "."
      docker-build-args:
        description: "Build args, um por linha (CHAVE=valor)"
        type: string
        default: ""
      enable-trivy-filesystem-scan:
        type: boolean
        default: true
      enable-trivy-image-scan:
        type: boolean
        default: true
      enable-deploy:
        description: "false = só testa e analisa (ex.: pull requests)"
        type: boolean
        default: true
    secrets:
      platform-token:
        description: "Token com Contents: write no repositório da plataforma"
        required: false

jobs:
  test:
    if: inputs.test-command != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Dependências
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: Testes
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}
      - name: Build de verificação
        if: inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

  build:
    needs: test
    # roda mesmo quando "test" foi pulado, mas não quando falhou
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Nome e tag da imagem
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Trivy — código (vulnerabilidades e segredos; falha em CRITICAL)
        if: inputs.enable-trivy-filesystem-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          skip-dirs: node_modules
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # QEMU: estágios do Dockerfile que rodam na arquitetura de destino (arm64)
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Estágio de compilação em $BUILDPLATFORM (amd64, nativo) com publicação cruzada para arm64;
      # o QEMU só executa os estágios finais que tenham RUN (as imagens das apps não têm).
      - name: Build e push (linux/arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm64
          build-args: ${{ inputs.docker-build-args }}
          push: ${{ inputs.enable-deploy }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        if: inputs.enable-deploy
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}@${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy — imagem (falha em CRITICAL com correção disponível)
        if: inputs.enable-trivy-image-scan && inputs.enable-deploy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  update-manifest:
    needs: build
    # always(): sem ele, o job é pulado quando "test" foi pulado (test-command vazio), mesmo com o
    # build aprovado — o GitHub propaga o "skipped" de qualquer ancestral.
    if: always() && needs.build.result == 'success' && inputs.enable-deploy
    runs-on: ubuntu-latest
    concurrency:
      group: update-manifest-${{ inputs.platform-repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform-repository }}
          token: ${{ secrets.platform-token }}
          path: platform

      # Grava tag (legível) e digest (imutável) no bloco images: do overlay. Com digest, o Kustomize
      # renderiza <imagem>:<tag>@sha256:..., e o kubelet baixa exatamente o conteúdo construído aqui,
      # mesmo que alguém reescreva a tag no GHCR (tags de registro são mutáveis).
      - name: Gravar a imagem no overlay
        working-directory: platform
        env:
          FILE: ${{ inputs.overlay-path }}/kustomization.yaml
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
          APP: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          [ -f "$FILE" ] || { echo "::error::$FILE não existe no repositório da plataforma"; exit 1; }
          [ -n "$DIGEST" ] || { echo "::error::build não devolveu o digest da imagem"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            yq -e '.images[] | select(.name == strenv(IMAGE))' "$FILE" > /dev/null \
              || { echo "::error::$FILE não tem images[].name == $IMAGE"; exit 1; }
            yq -i '(.images[] | select(.name == strenv(IMAGE))) |= (.newTag = strenv(TAG) | .digest = strenv(DIGEST))' "$FILE"
            git add "$FILE"
            git diff --cached --quiet && { echo "Overlay já estava em ${TAG}"; exit 0; }
            # A esteira só pode alterar o próprio kustomization.yaml do overlay.
            [ "$(git diff --cached --name-only)" = "$FILE" ] || { echo "::error::alteração fora de $FILE"; exit 1; }
            git commit -m "deploy(${APP}): ${TAG}" -m "${IMAGE}@${DIGEST}"
            git push && exit 0
            echo "Push rejeitado; atualizando e tentando de novo (${tentativa})"
            git fetch origin && git reset --hard "origin/$(git rev-parse --abbrev-ref HEAD)"
          done
          exit 1
